<tr id="ingredient-{{ ingredient.id }}" class="border-t" style="border-color: var(--pop-line)">
  <td class="py-2 pr-3">
    <span class="font-medium">{{ ingredient.name }}</span>
    <span class="pop-muted ml-2 text-xs">{{ count or 0 }} recette{{ 's' if (count or 0) > 1 }}</span>
  </td>
  <td class="py-2 pr-3">
    <input
      type="text"
      name="default_unit"
      value="{{ ingredient.default_unit }}"
      list="unit-names"
      class="input input-bordered input-sm w-24 bg-base-100"
      hx-post="{{ url_for('ingredients.update', ingredient_id=ingredient.id) }}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML"
      hx-trigger="change"
      aria-label="Unité par défaut de {{ ingredient.name }}"
    />
  </td>
  <td class="py-2">
    <select
      name="category"
      class="select select-bordered select-sm w-full max-w-56 bg-base-100"
      hx-post="{{ url_for('ingredients.update', ingredient_id=ingredient.id) }}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML"
      hx-trigger="change"
      aria-label="Rayon de {{ ingredient.name }}"
    >
      {% for key, label, color in CATEGORIES %}
        <option value="{{ key }}" {{ 'selected' if ingredient.category == key }}>{{ label }}</option>
      {% endfor %}
    </select>
  </td>
</tr>
